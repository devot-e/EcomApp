
{% extends "base.html" %}

{% block title %}My Account | EcomApp{% endblock %}

{% block content %}
<div class="card">
    <h1>My Account</h1>
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong>
       {{ user.email|default:"Not provided" }}</p>
    <p><strong>Date joined:</strong> {{ user.date_joined }}</p>

    <a class="button" href="{% url 'product:product_list' %}">
        Continue Shopping
    </a>
</div>
{% endblock %}
