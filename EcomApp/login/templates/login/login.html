
{% extends "base.html" %}

{% block title %}Login | EcomApp{% endblock %}

{% block content %}
<div class="card" style="max-width:450px;margin:auto">
    <h1>Login</h1>

    <form method="post">
        {% csrf_token %}

        <label for="username">Username</label><br>
        <input id="username" type="text" name="username"
               autocomplete="username" required><br>

        <label for="password">Password</label><br>
        <input id="password" type="password" name="password"
               autocomplete="current-password" required><br>

        <button type="submit">Login</button>
    </form>

    <p>New customer?
       <a href="{% url 'login:register' %}">Create an account</a>
    </p>
</div>
{% endblock %}
